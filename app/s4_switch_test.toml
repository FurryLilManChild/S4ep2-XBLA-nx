# S4ep1-nx (2026-11-15): the Switch test build's settings (renut.toml next to renut.nro in sdmc:/switch/s4ep1-nx/),
# copied from TFU-nx's app/tfu_switch_test.toml (tested on the console there); the TFU forwarder id removed.
# TFU-nx: the Switch test build's settings (renut.toml next to renut.nro in sdmc:/switch/tfu-nx/).
# Made 2026-11-12 from rr6-nx's Switch settings (Renut on deko3d, tested on the console there), without RR6's
# game-specific keys (its native functions, its SMAA shader, its rr6_* fixes: those keep their defaults, as on the PC
# build that rendered TFU correctly). Logging is on: please send the whole logs folder after each test.

# Renderer: Renut on deko3d. No emulated GPU.
banjo_renderer = "renut"
renut_gpu_backend = "deko3d"
gpu_plugin = ""

# Logs (all in logs/ next to the NRO):
#   logs/renut_N.log          the main log, a new numbered file each launch; [tfu] build stamp first
#   logs/rex/rex_stderr.log    stderr, with the build stamp first (the launch before: rex_stderr.prev.log)
#   logs/rex/rex_crash.log     any crash: registers, the guest context, the stack (appended, with the build stamp)
#   logs/rex/rex_profile.log   every 10 s: each thread's CPU, clocks, temperatures, audio, GPU calls
#                              (the launch before: rex_profile.prev.log)
log_level = "info"
# Every 10 s: the GPU's time per frame by kind of work.
# The CPU sampler: every thread's code addresses into rex_profile.log (tells where the time goes).
switch_profile_stacks = true
# A PNG of the game image every 60 s into captures/ next to the NRO (at most 20): shows what was on screen.
nfsmw_captura_cada_s = 60
nfsmw_captura_max = 20
# Shaders the NRO lacks are written to shader_capture/ next to the NRO: please send that folder too.
renut_shader_capture_dir = "shader_capture"

# The resolution (Mark, 2026-11-12: 540p fixed in handheld; a port menu setting later). The 3D image is drawn at this
# height and scaled to the screen after TFU's final composite (pixel shader 9050898F454CF13D, found with the PC draw
# trace of build 2), and the HUD is drawn over it at the screen's full resolution. Docked: the game's own 720 lines
# for now, shown at 1080.
banjo_renut_smaa_after_ps = "9050898F454CF13D"
banjo_renut_smaa = false

# The rest: rr6-nx's Switch settings.
masseffect_renderer_native = false
gpu_allow_invalid_fetch_constants = true
