# Mark's first full PC build (2026-11-16), found by a cloud compile check of all the generated code: sub_826D01F0's
# byte jump table (lbzx from 0x82073710, base 0x826D0238, bctr at 0x826D0234) has no bounds check, so the generator
# read 513 entries; from entry 16 on the bytes belong to something else and point into sub_826D0340 (mid-sequence:
# 0x826D02B4 is the middle of an lwarx/stwcx. loop), giving gotos to labels that do not exist ("use of undeclared
# label 'loc_826D0908'"). Index r11 = [r3+0x110] - 1; the first 16 entries are the function's own targets (0x238,
# 0x268, and entry 4 at 0x826D0340, which the generator already wrote as a tail call).
[[switch_tables]]
address = 0x826D0234
register = 11
labels = [0x826D0268, 0x826D0268, 0x826D0268, 0x826D0268, 0x826D0340, 0x826D0268, 0x826D0268, 0x826D0268, 0x826D0268, 0x826D0238, 0x826D0268, 0x826D0268, 0x826D0238, 0x826D0238, 0x826D0238, 0x826D0238]

