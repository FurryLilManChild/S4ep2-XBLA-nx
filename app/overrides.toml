# Mark's Switch run of 8aff941b (2026-11-19, a crash after a special stage): rex_crash.log, brk #0x3e8 (a
# __builtin_trap) in sub_82399280, called from sub_82872E68. Its "bctr" at 0x823992A0 is a call through a table of 28
# function pointers at 0x820B6FE0 (all registered functions), indexed by [r3+4]; the generator read it as a jump table
# with the index in r10 (which holds the table's address), so the switch had one case and every other value trapped.
# The same bctr shape one function later (sub_823992A8, table 0x820B7050) was already an indirect call.
# katamari-nx's fix for the same misreading: an indirect call.
indirect_calls = [0x823992A0]

